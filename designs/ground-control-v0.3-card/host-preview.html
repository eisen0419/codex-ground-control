<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Ground Control v0.3 — Host Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "PingFang SC", sans-serif;
        --page: #ececef;
        --text: #1d1d1f;
        --muted: #6e6e73;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #111113;
          --text: #f5f5f7;
          --muted: #98989d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: var(--page);
      }

      main {
        display: grid;
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 48px 20px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
        padding-inline: 4px;
      }

      h1 {
        margin: 0 0 5px;
        font-size: 18px;
        font-weight: 650;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .tag {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      iframe {
        display: block;
        width: 100%;
        height: 260px;
        border: 0;
        background: transparent;
      }

      @media (max-width: 520px) {
        main {
          padding: 28px 12px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }

        iframe {
          height: 410px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Ground Control v0.3 状态卡</h1>
          <p>真实 widget 文件，使用本地 Host 模拟数据。</p>
        </div>
        <span class="tag">Final direction</span>
      </header>
      <iframe
        id="widget"
        title="Ground Control 状态卡"
        src="http://localhost:4312/assets/apps/ground-control/v0.3-leaf-session.html"
      ></iframe>
    </main>

    <script>
      (() => {
        const frame = document.getElementById("widget");
        const taskId = "50af7cf2-c972-42fb-848f-16679c44f842";
        const sessionId = "bfe7bdaf-30cf-4868-890b-9a505efa5269";
        const requestedState = new URLSearchParams(
          window.location.search,
        ).get("state");
        let state =
          requestedState === "cancelled" ? "cancelled" : "running";

        function payload() {
          const terminal = state === "cancelled";
          return {
            structuredContent: {
              schemaVersion: "0.3",
              taskId,
              adapterId: "pi-rpc",
              profile: "pi-glm",
              activity: "testing",
              provider: "pi",
              modelProvider: "zai-coding-cn",
              model: "glm-5.2",
              nativeSession: {
                id: sessionId,
                inspectable: true,
              },
              state,
              stage: terminal
                ? "provider-cancelled"
                : "provider-running",
              latestEvent: {
                sequence: terminal ? 4 : 2,
                type: terminal
                  ? "turn.cancelled"
                  : "turn.started",
                source: "provider-native",
                observedAt: new Date().toISOString(),
              },
              canCancel: !terminal,
              result: terminal
                ? { disposition: "candidate-evidence" }
                : null,
            },
          };
        }

        function send(message) {
          frame.contentWindow.postMessage(message, "*");
        }

        function publish() {
          send({
            jsonrpc: "2.0",
            method: "ui/notifications/tool-result",
            params: payload(),
          });
        }

        frame.addEventListener("load", () => {
          publish();
        });

        window.addEventListener("message", (event) => {
          if (event.source !== frame.contentWindow) {
            return;
          }
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") {
            return;
          }
          if (message.method === "ui/initialize") {
            send({
              jsonrpc: "2.0",
              id: message.id,
              result: {
                hostCapabilities: { serverTools: true },
              },
            });
            return;
          }
          if (message.method === "ui/notifications/size-changed") {
            frame.style.height = `${message.params.height}px`;
            return;
          }
          if (message.method === "tools/call") {
            if (message.params.name === "cancel_leaf") {
              state = "cancelled";
            }
            send({
              jsonrpc: "2.0",
              id: message.id,
              result: payload(),
            });
          }
        });
      })();
    </script>
  </body>
</html>
