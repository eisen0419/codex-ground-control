<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Ground Control v0.3 — Read-only Host Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "PingFang SC", sans-serif;
        --page: #ececef;
        --text: #1d1d1f;
        --muted: #6e6e73;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #111113;
          --text: #f5f5f7;
          --muted: #98989d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: var(--page);
      }

      main {
        display: grid;
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 48px 20px;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 18px;
        padding-inline: 4px;
      }

      h1 {
        margin: 0 0 5px;
        font-size: 18px;
        font-weight: 650;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .tag {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      iframe {
        display: block;
        width: 100%;
        height: 300px;
        border: 0;
        background: transparent;
      }

      @media (max-width: 520px) {
        main {
          padding: 28px 12px;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }

        iframe {
          height: 430px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Ground Control v0.3 只读状态卡</h1>
          <p>真实 app-host widget，使用已审计的脱敏终态。</p>
        </div>
        <span class="tag">Host candidate</span>
      </header>
      <iframe
        id="widget"
        title="Ground Control 只读状态卡"
        src="http://localhost:4312/spikes/pi-native-session/app-host-prototype/widget.html"
      ></iframe>
    </main>

    <script>
      (() => {
        const frame = document.getElementById("widget");
        const snapshot = {
          schemaVersion: "0.3-prototype",
          kind: "provider-native-leaf-card",
          card: {
            schemaVersion: "0.3",
            taskId: "3bf13088-e1f0-4b89-8972-3fa3cc234e48",
            adapterId: "pi-rpc",
            profile: "pi-glm",
            activity: "testing",
            provider: "pi",
            modelProvider: "zai-coding-cn",
            model: "glm-5.2",
            nativeSession: {
              id: "82f31f62-07fe-4aff-be8a-26601d37a57f",
              inspectable: true,
            },
            state: "cancelled",
            stage: "provider-cancelled",
            latestEvent: {
              sequence: 3,
              type: "turn.cancelled",
              source: "provider-native",
              observedAt: "2026-07-27T21:52:38.558Z",
            },
            canCancel: false,
            result: null,
          },
          proof: {
            probe: "pi-glm / no-tools / allow-live",
            nativeStartObserved: true,
            exactCancellationSettled: true,
            siblingStillResponsive: true,
            sourceEvidenceSha256:
              "d9082b32dcd83d7b0c4e72f761e8d4c5bbc2a4912f2517dd69c3b236c38b3064",
          },
          surface: {
            authority: "provider-native-session",
            nativeCodexSubagent: false,
            readOnlySnapshot: true,
          },
        };

        function send(message) {
          frame.contentWindow.postMessage(message, "*");
        }

        frame.addEventListener("load", () => {
          send({
            jsonrpc: "2.0",
            method: "ui/notifications/tool-result",
            params: { structuredContent: snapshot },
          });
        });

        window.addEventListener("message", (event) => {
          if (event.source !== frame.contentWindow) {
            return;
          }
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") {
            return;
          }
          if (message.method === "ui/initialize") {
            send({
              jsonrpc: "2.0",
              id: message.id,
              result: { hostCapabilities: {} },
            });
            return;
          }
          if (message.method === "ui/notifications/size-changed") {
            frame.style.height = `${message.params.height}px`;
          }
        });
      })();
    </script>
  </body>
</html>
